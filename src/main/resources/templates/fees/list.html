<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fees | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Hostel Fees</h3>
        <a th:href="@{/fees/new}" class="btn btn-primary">+ Add Fee Record</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="mb-3">
        <a th:href="@{/fees}" class="btn btn-sm" th:classappend="${!pending} ? 'btn-dark' : 'btn-outline-dark'">All records</a>
        <a th:href="@{/fees(pending=true)}" class="btn btn-sm" th:classappend="${pending} ? 'btn-dark' : 'btn-outline-dark'">Pending dues only</a>
    </div>

    <div class="table-responsive bg-body shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Student</th><th>Semester</th><th>Due</th><th>Paid</th><th>Balance</th>
                <th>Status</th><th>Last Payment</th><th>Mode</th><th class="text-end">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${fees}">
                <td th:text="|${f.student.name} (${f.student.rollNo})|"></td>
                <td th:text="${f.semester}"></td>
                <td th:text="|₹${f.amountDue}|"></td>
                <td th:text="|₹${f.amountPaid}|"></td>
                <td th:text="|₹${f.balance}|"></td>
                <td>
                    <span class="badge" th:text="${f.paymentStatus}"
                          th:classappend="${f.paymentStatus == 'Paid'} ? 'bg-success' : (${f.paymentStatus == 'Partial'} ? 'bg-warning text-dark' : 'bg-danger')"></span>
                </td>
                <td th:text="${f.payDate != null} ? ${f.payDate} : '-'"></td>
                <td th:text="${f.mode != null} ? ${f.mode} : '-'"></td>
                <td class="text-end">
                    <a th:if="${f.balance.signum() > 0}" th:href="@{/fees/pay/{id}(id=${f.paymentId})}"
                       class="btn btn-sm btn-outline-primary">Record Payment</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(fees)}">
                <td colspan="9" class="text-center text-body-secondary py-4">No fee records found.</td>
            </tr>
            </tbody>
            <tfoot th:if="${!#lists.isEmpty(fees)}">
            <tr class="table-group-divider">
                <td colspan="4" class="text-end fw-bold">Total outstanding</td>
                <td colspan="5" class="fw-bold" th:text="|₹${outstanding}|"></td>
            </tr>
            </tfoot>
        </table>
    </div>
</div>
</body>
</html>
