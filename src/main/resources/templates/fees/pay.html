<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Record Payment | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4" style="max-width: 620px;">

    <h3 class="mb-3">Record Payment</h3>

    <div class="bg-body p-3 shadow-sm rounded mb-3">
        <div><strong th:text="|${fee.student.name} (${fee.student.rollNo})|"></strong></div>
        <div class="text-body-secondary" th:text="|${fee.semester} - Due ₹${fee.amountDue}, Paid ₹${fee.amountPaid}|"></div>
        <div class="fw-bold mt-1" th:text="|Pending balance: ₹${fee.balance}|"></div>
    </div>

    <form th:action="@{/fees/pay/{id}(id=${fee.paymentId})}" method="post" class="bg-body p-4 shadow-sm rounded">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Amount (₹)</label>
                <input type="number" name="amount" class="form-control" min="1" step="0.01"
                       th:max="${fee.balance}" th:value="${fee.balance}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Payment Mode</label>
                <select name="mode" class="form-select" required>
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                    <option value="Bank">Bank</option>
                </select>
            </div>
        </div>

        <button class="btn btn-primary">Record Payment</button>
        <a th:href="@{/fees}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
