<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Fee Record | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4" style="max-width: 620px;">

    <h3 class="mb-3">Add Fee Record</h3>

    <form th:action="@{/fees/save}" method="post" class="bg-white p-4 shadow-sm rounded">
        <div class="mb-3">
            <label class="form-label">Student</label>
            <select name="studentId" class="form-select" required>
                <option value="">Select student</option>
                <option th:each="s : ${students}" th:value="${s.studentId}"
                        th:text="|${s.name} (${s.rollNo})|"></option>
            </select>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Semester</label>
                <input type="text" name="semester" class="form-control" placeholder="e.g. Sem 4" required maxlength="10">
            </div>
            <div class="col-md-6">
                <label class="form-label">Amount Due (₹)</label>
                <input type="number" name="amountDue" class="form-control" min="1" step="0.01" required>
            </div>
        </div>

        <button class="btn btn-primary">Save</button>
        <a th:href="@{/fees}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
