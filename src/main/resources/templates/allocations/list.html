<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Allocations | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Room Allocations</h3>
        <a th:href="@{/allocations/new}" class="btn btn-primary">+ Allocate Room</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>#</th><th>Student</th><th>Hostel</th><th>Room</th>
                <th>Allocated On</th><th>Vacated On</th><th>Status</th><th class="text-end">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${allocations}">
                <td th:text="${a.allocId}"></td>
                <td th:text="|${a.student.name} (${a.student.rollNo})|"></td>
                <td th:text="${a.room.hostel.name}"></td>
                <td th:text="${a.room.roomNo}"></td>
                <td th:text="${a.allocDate}"></td>
                <td th:text="${a.vacateDate != null} ? ${a.vacateDate} : '-'"></td>
                <td>
                    <span class="badge" th:text="${a.status}"
                          th:classappend="${a.status == 'Active'} ? 'bg-success' : 'bg-secondary'"></span>
                </td>
                <td class="text-end">
                    <form th:if="${a.status == 'Active'}"
                          th:action="@{/allocations/vacate/{id}(id=${a.allocId})}" method="post"
                          onsubmit="return confirm('Vacate this student from the room?');">
                        <button class="btn btn-sm btn-outline-danger">Vacate</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(allocations)}">
                <td colspan="8" class="text-center text-muted py-4">No allocations yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
