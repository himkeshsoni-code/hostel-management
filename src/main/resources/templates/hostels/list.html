<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hostels | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Hostels</h3>
        <a th:href="@{/hostels/new}" class="btn btn-primary">+ Add Hostel</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr><th>ID</th><th>Name</th><th>Type</th><th>Total Rooms</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="h : ${hostels}">
                <td th:text="${h.hostelId}"></td>
                <td th:text="${h.name}"></td>
                <td th:text="${h.type}"></td>
                <td th:text="${h.totalRooms}"></td>
                <td class="text-end">
                    <a th:href="@{/rooms(hostelId=${h.hostelId})}" class="btn btn-sm btn-outline-secondary">Rooms</a>
                    <a th:href="@{/hostels/edit/{id}(id=${h.hostelId})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form th:action="@{/hostels/delete/{id}(id=${h.hostelId})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this hostel?');">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(hostels)}">
                <td colspan="5" class="text-center text-muted py-4">No hostels found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
