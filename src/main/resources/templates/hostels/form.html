<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Hostel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4" style="max-width: 620px;">

    <h3 class="mb-3" th:text="${title}">Hostel</h3>

    <form th:action="@{/hostels/save}" th:object="${hostel}" method="post" class="bg-white p-4 shadow-sm rounded">
        <input type="hidden" th:field="*{hostelId}">

        <div class="mb-3">
            <label class="form-label">Hostel Name</label>
            <input type="text" th:field="*{name}" class="form-control" required maxlength="50">
        </div>
        <div class="mb-3">
            <label class="form-label">Type</label>
            <select th:field="*{type}" class="form-select" required>
                <option value="">Select</option>
                <option value="Boys">Boys</option>
                <option value="Girls">Girls</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Total Rooms</label>
            <input type="number" th:field="*{totalRooms}" class="form-control" min="1" required>
        </div>

        <button class="btn btn-primary">Save</button>
        <a th:href="@{/hostels}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
