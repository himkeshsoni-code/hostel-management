<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visitors | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Visitor Log</h3>
        <a th:href="@{/visitors/new}" class="btn btn-primary">+ Check In Visitor</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>#</th><th>Visitor</th><th>Relation</th><th>Visiting</th>
                <th>In Time</th><th>Out Time</th><th class="text-end">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${visits}">
                <td th:text="${v.visitId}"></td>
                <td th:text="${v.visitorName}"></td>
                <td th:text="${v.relation}"></td>
                <td th:text="|${v.student.name} (${v.student.rollNo})|"></td>
                <td th:text="${#temporals.format(v.inTime, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${v.outTime != null} ? ${#temporals.format(v.outTime, 'dd-MM-yyyy HH:mm')} : '-'"></td>
                <td class="text-end">
                    <form th:if="${v.outTime == null}" th:action="@{/visitors/checkout/{id}(id=${v.visitId})}" method="post">
                        <button class="btn btn-sm btn-outline-primary">Check Out</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(visits)}">
                <td colspan="7" class="text-center text-muted py-4">No visitors yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
