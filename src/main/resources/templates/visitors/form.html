<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check In Visitor | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4" style="max-width: 620px;">

    <h3 class="mb-3">Check In Visitor</h3>

    <form th:action="@{/visitors/save}" method="post" class="bg-body p-4 shadow-sm rounded">
        <div class="mb-3">
            <label class="form-label">Student being visited</label>
            <select name="studentId" class="form-select" required>
                <option value="">Select student</option>
                <option th:each="s : ${students}" th:value="${s.studentId}"
                        th:text="|${s.name} (${s.rollNo})|"></option>
            </select>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Visitor Name</label>
                <input type="text" name="visitorName" class="form-control" required maxlength="80">
            </div>
            <div class="col-md-6">
                <label class="form-label">Relation</label>
                <input type="text" name="relation" class="form-control" placeholder="e.g. Father" required maxlength="30">
            </div>
        </div>

        <button class="btn btn-primary">Check In</button>
        <a th:href="@{/visitors}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
