<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/students}">Hostel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/students}">Students</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/hostels}">Hostels</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/rooms}">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/allocations}">Allocations</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/fees}">Fees</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/complaints}">Complaints</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/visitors}">Visitors</a></li>
            </ul>
            <span class="navbar-text me-3" th:if="${session.warden != null}"
                  th:text="${session.warden.name}">Warden</span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
