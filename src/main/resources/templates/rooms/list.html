<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rooms | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Rooms</h3>
        <a th:href="@{/rooms/new}" class="btn btn-primary">+ Add Room</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/rooms}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <select name="hostelId" class="form-select" onchange="this.form.submit()">
                <option value="">All hostels</option>
                <option th:each="h : ${hostels}" th:value="${h.hostelId}" th:text="${h.name}"
                        th:selected="${selectedHostel != null and selectedHostel == h.hostelId}"></option>
            </select>
        </div>
    </form>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Hostel</th><th>Room No</th><th>Floor</th><th>Capacity</th>
                <th>Occupied</th><th>Free Beds</th><th>Status</th><th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rooms}">
                <td th:text="${r.hostel.name}"></td>
                <td th:text="${r.roomNo}"></td>
                <td th:text="${r.floor}"></td>
                <td th:text="${r.capacity}"></td>
                <td th:text="${r.occupied}"></td>
                <td th:text="${r.capacity - r.occupied}"></td>
                <td>
                    <span class="badge" th:text="${r.status}"
                          th:classappend="${r.status == 'Full'} ? 'bg-danger' : 'bg-success'"></span>
                </td>
                <td class="text-end">
                    <a th:href="@{/rooms/edit/{id}(id=${r.roomId})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form th:action="@{/rooms/delete/{id}(id=${r.roomId})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this room?');">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rooms)}">
                <td colspan="8" class="text-center text-muted py-4">No rooms found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
