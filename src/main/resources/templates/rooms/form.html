<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4" style="max-width: 620px;">

    <h3 class="mb-3" th:text="${title}">Room</h3>

    <form th:action="@{/rooms/save}" th:object="${room}" method="post" class="bg-body p-4 shadow-sm rounded">
        <input type="hidden" th:field="*{roomId}">
        <input type="hidden" th:field="*{occupied}">
        <input type="hidden" th:field="*{status}">

        <div class="mb-3">
            <label class="form-label">Hostel</label>
            <select th:field="*{hostel.hostelId}" class="form-select" required>
                <option value="">Select hostel</option>
                <option th:each="h : ${hostels}" th:value="${h.hostelId}"
                        th:text="${h.name} + ' (' + ${h.type} + ')'"></option>
            </select>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Room No</label>
                <input type="text" th:field="*{roomNo}" class="form-control" required maxlength="10">
            </div>
            <div class="col-md-4">
                <label class="form-label">Floor</label>
                <input type="number" th:field="*{floor}" class="form-control" min="0" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Capacity (1-6)</label>
                <input type="number" th:field="*{capacity}" class="form-control" min="1" max="6" required>
            </div>
        </div>

        <button class="btn btn-primary">Save</button>
        <a th:href="@{/rooms}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
