<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <h3 class="mb-4">Reports</h3>

    <h5>Fee Defaulters <small class="text-muted">(from view fee_defaulters)</small></h5>
    <div class="table-responsive bg-white shadow-sm rounded mb-5">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr><th>Roll No</th><th>Name</th><th>Phone</th><th>Total Due</th><th>Total Paid</th><th>Balance</th></tr>
            </thead>
            <tbody>
            <tr th:each="row : ${defaulters}">
                <td th:text="${row[0]}"></td>
                <td th:text="${row[1]}"></td>
                <td th:text="${row[2]}"></td>
                <td th:text="|₹${row[3]}|"></td>
                <td th:text="|₹${row[4]}|"></td>
                <td class="fw-bold text-danger" th:text="|₹${row[5]}|"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(defaulters)}">
                <td colspan="6" class="text-center text-muted py-4">No pending dues.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h5>Vacant Rooms <small class="text-muted">(from view vacant_rooms)</small></h5>
    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr><th>Hostel</th><th>Type</th><th>Room</th><th>Floor</th><th>Capacity</th><th>Occupied</th><th>Free Beds</th></tr>
            </thead>
            <tbody>
            <tr th:each="row : ${vacant}">
                <td th:text="${row[0]}"></td>
                <td th:text="${row[1]}"></td>
                <td th:text="${row[2]}"></td>
                <td th:text="${row[3]}"></td>
                <td th:text="${row[4]}"></td>
                <td th:text="${row[5]}"></td>
                <td class="fw-bold text-success" th:text="${row[6]}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(vacant)}">
                <td colspan="7" class="text-center text-muted py-4">No vacant rooms.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
