<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Complaint | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4" style="max-width: 620px;">

    <h3 class="mb-3">New Complaint</h3>

    <form th:action="@{/complaints/save}" method="post" class="bg-white p-4 shadow-sm rounded">
        <div class="mb-3">
            <label class="form-label">Student</label>
            <select name="studentId" class="form-select" required>
                <option value="">Select student</option>
                <option th:each="s : ${students}" th:value="${s.studentId}"
                        th:text="|${s.name} (${s.rollNo})|"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
                <option value="Electrical">Electrical</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Food">Food</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" maxlength="255" required></textarea>
        </div>

        <button class="btn btn-primary">Submit</button>
        <a th:href="@{/complaints}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
