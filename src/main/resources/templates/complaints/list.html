<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Complaints | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Complaints</h3>
        <a th:href="@{/complaints/new}" class="btn btn-primary">+ New Complaint</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="mb-3">
        <a th:href="@{/complaints}" class="btn btn-sm" th:classappend="${selected == null} ? 'btn-dark' : 'btn-outline-dark'">All</a>
        <a th:href="@{/complaints(status='Open')}" class="btn btn-sm" th:classappend="${selected == 'Open'} ? 'btn-dark' : 'btn-outline-dark'">Open</a>
        <a th:href="@{/complaints(status='In Progress')}" class="btn btn-sm" th:classappend="${selected == 'In Progress'} ? 'btn-dark' : 'btn-outline-dark'">In Progress</a>
        <a th:href="@{/complaints(status='Resolved')}" class="btn btn-sm" th:classappend="${selected == 'Resolved'} ? 'btn-dark' : 'btn-outline-dark'">Resolved</a>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>#</th><th>Student</th><th>Category</th><th>Description</th>
                <th>Raised On</th><th>Resolved On</th><th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${complaints}">
                <td th:text="${c.complaintId}"></td>
                <td th:text="|${c.student.name} (${c.student.rollNo})|"></td>
                <td th:text="${c.category}"></td>
                <td th:text="${c.description}"></td>
                <td th:text="${c.raisedOn}"></td>
                <td th:text="${c.resolvedOn != null} ? ${c.resolvedOn} : '-'"></td>
                <td>
                    <form th:action="@{/complaints/status/{id}(id=${c.complaintId})}" method="post">
                        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="Open" th:selected="${c.status == 'Open'}">Open</option>
                            <option value="In Progress" th:selected="${c.status == 'In Progress'}">In Progress</option>
                            <option value="Resolved" th:selected="${c.status == 'Resolved'}">Resolved</option>
                        </select>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(complaints)}">
                <td colspan="7" class="text-center text-muted py-4">No complaints found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
