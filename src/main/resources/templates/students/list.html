<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students | Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Students</h3>
        <a th:href="@{/students/new}" class="btn btn-primary">+ Add Student</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/students}" method="get" class="row g-2 mb-3">
        <div class="col">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                   placeholder="Search by name or roll no">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary">Search</button>
            <a th:href="@{/students}" class="btn btn-link">Reset</a>
        </div>
    </form>

    <div class="table-responsive bg-body shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Roll No</th><th>Name</th><th>Gender</th><th>Dept</th>
                <th>Year</th><th>Phone</th><th>Guardian</th><th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.rollNo}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.gender}"></td>
                <td th:text="${s.dept}"></td>
                <td th:text="${s.year}"></td>
                <td th:text="${s.phone}"></td>
                <td th:text="${s.guardianName}"></td>
                <td class="text-end">
    <a th:href="@{/students/edit/{id}(id=${s.studentId})}"
       class="btn btn-sm btn-outline-primary" title="Edit">
        <i class="bi bi-pencil-fill"></i>
    </a>
    <form th:action="@{/students/delete/{id}(id=${s.studentId})}" method="post"
          class="d-inline" onsubmit="return confirm('Delete this student?');">
        <button class="btn btn-sm btn-outline-danger" title="Delete">
            <i class="bi bi-trash-fill"></i>
        </button>
    </form>
</td>
                
            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="8" class="text-center text-body-secondary py-4">No students found.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
