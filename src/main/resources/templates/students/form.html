<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-4" style="max-width: 720px;">

    <h3 class="mb-3" th:text="${title}">Student</h3>

    <form th:action="@{/students/save}" th:object="${student}" method="post"
          class="bg-white p-4 shadow-sm rounded">

        <input type="hidden" th:field="*{studentId}">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Roll No</label>
                <input type="text" th:field="*{rollNo}" class="form-control" required maxlength="20">
            </div>
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" th:field="*{name}" class="form-control" required maxlength="80">
            </div>
            <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select th:field="*{gender}" class="form-select" required>
                    <option value="">Select</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>
            <div class="col-md-5">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{dept}" class="form-control" maxlength="40">
            </div>
            <div class="col-md-3">
                <label class="form-label">Year</label>
                <input type="number" th:field="*{year}" class="form-control" min="1" max="5">
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control" maxlength="15">
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" maxlength="80">
            </div>
            <div class="col-md-6">
                <label class="form-label">Guardian Name</label>
                <input type="text" th:field="*{guardianName}" class="form-control" maxlength="80">
            </div>
            <div class="col-md-6">
                <label class="form-label">Guardian Phone</label>
                <input type="text" th:field="*{guardianPhone}" class="form-control" maxlength="15">
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-primary">Save</button>
            <a th:href="@{/students}" class="btn btn-link">Cancel</a>
        </div>
    </form>
   

</div>
</body>
</html>
